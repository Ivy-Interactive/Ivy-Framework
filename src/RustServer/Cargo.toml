[package]
name = "rustserver"
version = "0.1.0"
edition = "2024"

[lib]
name = "rustserver"
crate-type = ["cdylib"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
futures-util = "0.3"
