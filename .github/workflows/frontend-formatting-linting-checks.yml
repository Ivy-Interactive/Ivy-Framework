name: Frontend Code Quality Checks
permissions:
  contents: read
on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'frontend/**'

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # Setup Node.js
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    # Build and link ivy-design-system package
    - name: Build ivy-design-system
      working-directory: ./Ivy-Design-System
      run: |
        npm ci
        npm run build
        npm pack

    - name: Install dependencies
      working-directory: ./frontend
      run: |
        npm ci
        npm install ../Ivy-Design-System/ivy-design-system-*.tgz
    
    # Frontend code quality checks
    - name: Check code formatting
      working-directory: ./frontend
      run: npm run format:check
    
    - name: Check linting
      working-directory: ./frontend
      run: npm run lint
    
    - name: Check frontend build
      working-directory: ./frontend
      run: npm run build 