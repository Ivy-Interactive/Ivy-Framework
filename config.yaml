tendrilData: D:\Tendril
agentCommand: claude --print --verbose --output-format stream-json --dangerously-skip-permissions

levels:
  - name: Critical
    badge: Warning
  - name: Bug
    badge: Destructive
  - name: NiceToHave
    badge: Outline
  - name: Epic
    badge: Info

projects:
  - name: Framework
    repos:
      - path: D:\Repos\_Ivy\Ivy-Framework
        prRule: yolo
    verifications:
      - name: DotnetBuild
        required: true
      - name: DotnetFormat
        required: true
      - name: DotnetTest
        required: true
      - name: FrontendLint
        required: true
      - name: IvyFrameworkVerification
        required: true
      - name: NewWidgetChecklist
        required: false
      - name: CheckResult
        required: false
    context: |
      Ivy Framework is the core UI framework. Key folders:
      - src/Ivy/Widgets/ — backend widget classes
      - src/frontend/src/widgets/ — React widget components
      - src/Ivy.Docs.Shared/Docs/ — documentation
      - src/Ivy.Samples.Shared/ — sample apps
      Instructions: See D:\Repos\_Ivy\Ivy-Framework\AGENTS.md

  - name: Agent
    repos:
      - path: D:\Repos\_Ivy\Ivy-Agent
        prRule: yolo
      - path: D:\Repos\_Ivy\Ivy
        prRule: yolo
    verifications:
      - name: DotnetBuild
        required: true
      - name: DotnetFormat
        required: true
      - name: DotnetTest
        required: true
      - name: CheckResult
        required: false
    context: |
      Ivy Agent is the AI agent server and client. Key folders:
      - Ivy.Agent.Server/ — agent server
      - Ivy.Agent/Agents/Personas/Prompts/ — persona prompts
      - Ivy.Internals/Workflows/ — workflow definitions
      - Ivy.Agent/Tools/ — tool implementations

  - name: Console
    repos:
      - path: D:\Repos\_Ivy\Ivy
        prRule: yolo
    verifications:
      - name: DotnetBuild
        required: true
      - name: DotnetFormat
        required: true
      - name: DotnetTest
        required: true
      - name: CheckResult
        required: false
    context: |
      Console/TUI client. Key folders:
      - Ivy.Console/ — desktop client
      - Ivy.Internals/ — shared internals

  - name: MyPromptwares
    repos:
      - path: D:\Repos\_Personal\MyPromptwares
        prRule: yolo
    context: |
      Personal promptwares.

  - name: Scripts
    repos:
      - path: D:\Repos\_Personal\Scripts
        prRule: yolo
    context: |
      Personal scripts and agentic applications.
      - AF2/ — promptwares (MakePlan, IvyAgentDebug, etc.)
      - AF2/.vscode-extensions/ — VS Code extensions (installed via symlinks)

  - name: Tendril
    repos:
      - path: D:\Repos\_Ivy\Ivy-Tendril
        prRule: yolo
    verifications:
      - name: DotnetBuild
        required: true
      - name: DotnetFormat
        required: true
      - name: DotnetTest
        required: false
      - name: CheckResult
        required: false
    context: |
      Plan management TUI. Key folders:
      - Services/ — ConfigService, PlanReaderService, JobService
      - Apps/ — PlansApp, JobsApp UI
      - .promptwares/ — MakePlan, UpdatePlan, SplitPlan, ExpandPlan
      This project uses the Ivy Framework - there's CLI helper methods you can use: 
      ivy docs AGENTS.md 
      ivy question "How do I make a button in Ivy?"

  - name: Mcp
    repos:
      - path: D:\Repos\_Ivy\Ivy-Mcp
        prRule: yolo
    verifications:
      - name: DotnetBuild
        required: true
      - name: DotnetFormat
        required: true
      - name: DotnetTest
        required: true
      - name: CheckResult
        required: false
    context: |
      MCP service for IvyQuestions and IvyDocs.

verifications:
  - name: DotnetBuild
    prompt: "Run `dotnet build --warnaserror` in the project repo and verify it succeeds with zero errors and zero warnings."
  - name: DotnetTest
    prompt: "Run `dotnet test` in the project repo and verify all tests pass."
  - name: DotnetFormat
    prompt: "Run `dotnet format` in the project repo. If it modifies any files, stage and commit them."
  - name: FrontendLint
    prompt: "Run `cd src/frontend && npm run lint && npm run format:check` and verify no errors."
  - name: IvyFrameworkVerification
    prompt: "Run the IvyFrameworkVerification promptware to visually verify UI changes. Execute: `pwsh -NoProfile -File D:\\Repos\\_Ivy\\Ivy-Tendril\\.promptwares\\IvyFrameworkVerification.ps1 -PlanPath <PlanFolder>`. Creates a temp project with demo apps, runs Playwright tests, and copies artifacts to <PlanFolder>/artifacts/. Write the verification report to <PlanFolder>/verification/IvyFrameworkVerification.md."
  - name: CheckResult
    prompt: |
      Verify the implementation matches what was requested in the plan.

      1. Read the plan revision from `<PlanFolder>/revisions/` (latest numbered .md file)
      2. Read all commits made by this execution from `plan.yaml` `commits` list
      3. For each commit, review the diff (`git show <hash>`) in the worktree
      4. Compare the plan's **Problem** and **Solution** sections against the actual changes:
         - Are all described changes present?
         - Are there unexpected/unrelated changes?
         - Do the changes solve the stated problem?
      5. If the plan has a **Tests** section, verify those tests were actually written
      6. Write the verification report to `<PlanFolder>/verification/CheckResult.md`

      Report format:
      ```
      # CheckResult

      - **Date:** <CurrentTime>
      - **Result:** Pass / Fail
      - **Attempts:** 1

      ## Requested vs Delivered

      | Requirement | Status | Notes |
      |-------------|--------|-------|
      | <from plan> | Done / Missing / Partial | <details> |

      ## Unexpected Changes

      <list any changes not described in the plan, or "None">

      ## Output

      <summary assessment>

      ## Fixes Applied

      None

      ## Issues Found

      <any gaps between plan and implementation, or "None">
      ```
  - name: NewWidgetChecklist
    prompt: |
      Verify all 6 required elements exist for any new widget created by this plan:
      1. Backend widget class — src/Ivy/Widgets/<WidgetName>.cs with [Prop]/[Event] attributes, [JsonIgnore] on delegates, Has* booleans
      2. Frontend React component — src/frontend/src/widgets/<widgetName>/<WidgetName>Widget.tsx
      3. Index export — src/frontend/src/widgets/<widgetName>/index.ts
      4. Widget map registration — import + entry in src/frontend/src/widgets/widgetMap.ts
      5. Sample app — src/Ivy.Samples.Shared/Apps/Widgets/<WidgetName>App.cs
      6. Documentation page — src/Ivy.Docs.Shared/Docs/02_Widgets/<category>/<WidgetName>.md
      Check each file exists and follows conventions. Report which elements are present vs missing.

planTemplate: |
  # {title}

  ## Questions

  ## Problem

  ## Solution

  ## Tests

  (specify all tests we need to write to ensure new functionality)

  ## Verification
